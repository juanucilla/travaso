[package]
name = "travaso"
version = "1.1.0"
edition = "2021"
rust-version = "1.89"
description = "MCP server che travasa la memoria da un'IA all'altra (conserva, scarica, svuota) e la condivide tra più IA."
license = "MIT"
repository = "https://github.com/juanucilla/travaso"
readme = "../README.md"
keywords = ["mcp", "memory", "chatgpt", "claude", "cursor"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha1_smol = "1"
unicode-normalization = "0.1"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
